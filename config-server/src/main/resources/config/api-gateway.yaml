
server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-swagger
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: product-swagger
          uri: lb://product-service
          predicates:
            - Path=/v3/api-docs/product
          filters:
            - SetPath=/v3/api-docs

        - id: compatibility-swagger
          uri: lb://compatibility-service
          predicates:
            - Path=/v3/api-docs/compatibility
          filters:
            - SetPath=/v3/api-docs

        - id: order-swagger
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - SetPath=/v3/api-docs

        - id: auth-api-short
          uri: lb://auth-service
          predicates:
            - Path=/auth/login,/auth/register,/admin/**,/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth

        - id: auth-api
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth

        - id: product-api-short
          uri: lb://product-service
          predicates:
            - Path=/components,/components/**,/categories,/categories/**,/builds,/builds/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCB
                fallbackUri: forward:/fallback/product

        - id: product-api
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/builds/**,/api/components/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: productServiceCB
                fallbackUri: forward:/fallback/product

        - id: compatibility-api-short
          uri: lb://compatibility-service
          predicates:
            - Path=/compatibility,/compatibility/**,/check,/check/**,/rules,/rules/**,/logs,/logs/**
          filters:
            - name: CircuitBreaker
              args:
                name: compatibilityServiceCB
                fallbackUri: forward:/fallback/compatibility

        - id: compatibility-api
          uri: lb://compatibility-service
          predicates:
            - Path=/api/compatibility/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: compatibilityServiceCB
                fallbackUri: forward:/fallback/compatibility

        - id: order-api-short
          uri: lb://order-service
          predicates:
            - Path=/orders,/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/order

        - id: order-api
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/order

resilience4j:
  circuitbreaker:
    instances:
      authServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      productServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      compatibilityServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      orderServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,env
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG

jwt:
  secret: 1h0FhMtnHGyjVa6yMJh4Si5TgOJNuzl7IGLcY9LXIc=

springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Product Service
        url: /v3/api-docs/product
      - name: Compatibility Service
        url: /v3/api-docs/compatibility
      - name: Order Service
        url: /v3/api-docs/order
