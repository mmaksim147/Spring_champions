server:
  port: 8085
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: frontend-service

  config:
    import: "optional:configserver:http://localhost:8888"

  thymeleaf:
    cache: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  session:
    store-type: redis
    timeout: 12h
    redis:
      namespace: colizant:frontend:sessions
      repository-type: indexed

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

gateway:
  url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always