server:
  port: 8085

spring:
  application:
    name: frontend-service
  config:
    import: "optional:configserver:http://localhost:8888"
  thymeleaf:
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

gateway:
  url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always