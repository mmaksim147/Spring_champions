<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление категориями | Colizant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header('admin')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="admin-page">
    <div class="container page">
        <div class="page-head">
            <div>
                <a th:href="@{/admin}" class="back-link">← В админ-панель</a>
                <h1>Управление категориями</h1>
                <p>Создание и удаление категорий комплектующих.</p>
            </div>
        </div>

        <div th:if="${error}" class="builder-alert" role="alert" th:text="${error}"></div>

        <!-- Форма создания категории -->
        <section class="card" style="margin-bottom: 2rem;">
            <h2>Добавить категорию</h2>
            <form th:action="@{/admin/categories/create}" method="post" class="catalog-toolbar" style="margin-top: 1rem;">
                <input class="input" type="text" name="name" placeholder="Название категории" required style="flex: 1;">
                <button class="btn btn-primary" type="submit">Создать</button>
            </form>
        </section>

        <!-- Список категорий -->
        <section class="card">
            <h2>Существующие категории</h2>
            <div class="stack" style="margin-top: 1rem;" th:if="${categories != null and !#lists.isEmpty(categories)}">
                <div class="cart-row" th:each="cat : ${categories}" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong th:text="${cat.name}">Название</strong>
                        <div class="muted">ID: <span th:text="${cat.id}">1</span></div>
                    </div>
                    <form th:action="@{'/admin/categories/delete/' + ${cat.id}}" method="post" onsubmit="return confirm('Удалить категорию?');">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </div>
            </div>
            <div class="empty" th:if="${categories == null or #lists.isEmpty(categories)}">
                <p>Категории пока не созданы.</p>
            </div>
        </section>
    </div>
</main>

<footer class="site-footer">© 2026 Colizant</footer>
</body>
</html>
