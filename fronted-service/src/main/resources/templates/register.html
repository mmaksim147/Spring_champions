<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация: Colizant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header('register')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="auth-wrapper">

    <img th:src="@{/images/mascot.png}"
         alt="Colizant mascot"
         class="auth-mascot">

    <div class="auth-card">

        <h1>Создать аккаунт</h1>

        <form th:action="@{/register}" method="post">

            <div class="form-group">
                <label for="username">Логин</label>

                <input class="input"
                       type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input class="input"
                       type="email"
                       id="email"
                       name="email"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input class="input"
                       type="password"
                       id="password"
                       name="password"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Зарегистрироваться
            </button>

        </form>

        <p class="auth-switch">
            Уже есть аккаунт?
            <a th:href="@{/login}">Войти</a>
        </p>

    </div>
</main>

<footer class="site-footer">© 2026 Colizant</footer>
</body>
</html>
