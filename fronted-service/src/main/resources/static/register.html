<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - PC Builder</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
    <a href="/" class="logo">⚙️ PC Builder</a>
    <nav class="main-nav">
        <a href="/">Главная</a>
    </nav>
    <div class="auth-buttons">
        <a href="/login.html" class="btn btn-outline">Вход</a>
    </div>
</header>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Создать аккаунт</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
            <div id="error" class="error-msg"></div>
        </form>
        <div class="auth-links">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </div>
    </div>
</div>

<script src="/api.js"></script>
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errDiv = document.getElementById('error');

        try {
            await apiRequest('/auth/register', 'POST', { username, email, password });
            alert('Успешно! Теперь войдите в аккаунт.');
            window.location.href = '/login.html';
        } catch (err) {
            errDiv.innerText = err.message || 'Ошибка регистрации';
        }
    });
</script>
</body>
</html>
