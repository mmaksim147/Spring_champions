<div class="page-container" id="page-components">
    <h2>Добавить компонент</h2>
    <div class="form-panel">
        <input type="text" id="comp-name" placeholder="Название">
        <input type="text" id="comp-manuf" placeholder="Производитель">
        <input type="number" id="comp-price" placeholder="Цена">
        <input type="number" id="comp-stock" placeholder="Кол-во">
        <select id="comp-category"></select>
        <button onclick="createComponent()">Создать</button>
    </div>
    <h2>Список комплектующих</h2>
    <div class="grid" id="components-grid"></div>
</div>
