<div class="page-container active" id="page-login" style="display: flex; align-items: center; justify-content: center;">
    <div class="auth-card" style="width: 350px; background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border);">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Вход</h2>
        <input type="text" id="login-username" placeholder="Логин (admin)">
        <input type="password" id="login-password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="login-error" style="color: var(--danger); text-align: center; margin-top: 10px;"></div>
    </div>
</div>
