<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - PC Builder</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
    <a href="/" class="logo">⚙️ PC Builder</a>
    <div class="auth-buttons">
        <a href="/" class="btn btn-outline">На сайт</a>
        <button class="btn btn-primary" onclick="logout()">Выйти</button>
    </div>
</header>

<div class="dashboard-layout">
    <aside class="sidebar">
        <a href="#" class="active" onclick="switchAdminTab('products', this)">Товары</a>
        <a href="#" onclick="switchAdminTab('categories', this)">Категории</a>
        <a href="#" onclick="switchAdminTab('users', this)">Пользователи</a>
    </aside>
    <main class="dashboard-content">
        <!-- Вкладка Товары -->
        <div id="admin-products">
            <h2>Управление товарами</h2>
            <button class="btn-primary" style="margin: 15px 0;" onclick="alert('Форма добавления товара в разработке')">+ Добавить товар</button>
            <table id="admin-products-table">
                <thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Действия</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <!-- Вкладка Категории -->
        <div id="admin-categories" class="hidden">
            <h2>Управление категориями</h2>
            <table id="admin-categories-table">
                <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <!-- Вкладка Пользователи -->
        <div id="admin-users" class="hidden">
            <h2>Пользователи системы</h2>
            <table id="admin-users-table">
                <thead><tr><th>ID</th><th>Логин</th><th>Email</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
</div>
<script src="/api.js"></script>
<script src="/admin.js"></script>
</body>
</html>
