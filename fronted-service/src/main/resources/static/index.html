<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PC Builder - Сборка мечты</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ШАПКА -->
<header class="site-header">
    <a href="/" class="logo">⚙️ PC Builder</a>
    <nav class="main-nav">
        <a href="/" class="active">Главная</a>
        <a href="#catalog">Каталог</a>
    </nav>

    <!-- Блок для НЕавторизованных -->
    <div class="auth-buttons" id="auth-buttons">
        <a href="/login.html" class="btn btn-outline">Вход</a>
        <a href="/register.html" class="btn btn-primary">Регистрация</a>
    </div>

    <!-- Блок для АВТОРИЗОВАННЫХ (скрыт по умолчанию) -->
    <div class="auth-buttons hidden" id="user-profile">
        <a href="/profile.html" class="btn btn-outline">Личный кабинет</a>

        <!-- Кнопка Админки (появится только для ROLE_ADMIN) -->
        <a href="/admin.html" class="btn btn-primary" id="admin-btn" style="display: none;">Админ-панель</a>

        <button class="btn btn-outline" onclick="logout()">Выйти</button>
    </div>
</header>

<!-- ГЛАВНЫЙ БАННЕР -->
<section class="hero">
    <div class="container">
        <h1>Собери ПК своей мечты</h1>
        <p>Лучшие комплектующие по доступным ценам.</p>
        <a href="#catalog" class="btn btn-primary" style="padding: 15px 30px; font-size: 18px;">Перейти в каталог</a>
    </div>
</section>

<!-- КАТАЛОГ -->
<section class="container" id="catalog">
    <h2>Каталог комплектующих</h2>

    <!-- Фильтры по категориям -->
    <div class="filters" id="category-filters" style="margin-top: 15px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="filter-btn active" onclick="filterCatalog(null, this)">Все</button>
        <!-- Категории подгрузятся через JS -->
    </div>

    <!-- Сетка товаров -->
    <div class="grid" id="products-grid">
        <!-- Карточки подгрузятся через JS -->
    </div>
</section>

<!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
<script src="/api.js"></script>
<script src="/app.js"></script>
</body>
</html>
