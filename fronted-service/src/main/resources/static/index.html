<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PC Builder - Сборка мечты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ШАПКА -->
<header class="site-header">
    <div class="logo" onclick="window.scrollTo(0,0)">⚙️ PC Builder</div>
    <nav class="main-nav">
        <a href="#" class="active">Главная</a>
        <a href="#catalog">Каталог</a>
        <a href="#builds">Готовые сборки</a>
    </nav>
    <div class="auth-buttons" id="auth-buttons">
        <button class="btn-outline" onclick="openAuth('login')">Вход</button>
        <button class="btn-primary" onclick="openAuth('register')">Регистрация</button>
    </div>
    <div class="user-profile hidden" id="user-profile">
        <span id="user-name">Пользователь</span>
        <button class="btn-outline" onclick="logout()">Выйти</button>
    </div>
</header>

<!-- ГЛАВНЫЙ БАННЕР -->
<section class="hero">
    <div class="hero-content">
        <h1>Собери ПК своей мечты</h1>
        <p>Лучшие комплектующие по доступным ценам. Игры, работа, стримы — у нас есть всё.</p>
        <button class="btn-primary btn-large" onclick="document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})">Перейти в каталог</button>
    </div>
</section>

<!-- КАТАЛОГ -->
<section class="catalog" id="catalog">
    <div class="container">
        <div class="catalog-header">
            <h2>Каталог комплектующих</h2>
            <div class="filters" id="category-filters">
                <button class="filter-btn active" onclick="filterCatalog(null, this)">Все</button>
                <!-- Категории подгрузятся через JS -->
            </div>
        </div>
        <div class="grid" id="products-grid">
            <!-- Карточки товаров -->
        </div>
    </div>
</section>

<!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ -->
<div class="modal-overlay hidden" id="auth-modal">
    <div class="modal">
        <button class="close-btn" onclick="closeAuth()">×</button>
        <h2 id="modal-title">Вход в аккаунт</h2>

        <!-- Форма входа -->
        <form id="login-form" class="auth-form">
            <input type="text" id="login-username" placeholder="Логин" required>
            <input type="password" id="login-password" placeholder="Пароль" required>
            <button type="submit" class="btn-primary">Войти</button>
            <p class="switch-auth">Нет аккаунта? <a href="#" onclick="openAuth('register')">Зарегистрироваться</a></p>
        </form>

        <!-- Форма регистрации (скрыта по умолчанию) -->
        <form id="register-form" class="auth-form hidden">
            <input type="text" id="reg-username" placeholder="Логин" required>
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Пароль" required>
            <button type="submit" class="btn-primary">Создать аккаунт</button>
            <p class="switch-auth">Уже есть аккаунт? <a href="#" onclick="openAuth('login')">Войти</a></p>
        </form>
        <div id="auth-error" class="error-msg"></div>
    </div>
</div>

<!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
